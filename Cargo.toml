[package]
name = "libzstd-bitexact-rs"
# Version scheme: 0.<zstd-version-digits>.<our-patch>. The minor encodes the
# upstream zstd release this crate is bit-exact with (1.5.5 -> 155); the patch
# counts our own fixes against that target (0.155.1, 0.155.2, ...). The leading
# 0 marks the public API as still unstable. Retargeting a new zstd bumps the
# minor (1.5.8 -> 0.158.0). Keep in sync with the git tag (v0.155.0); the C
# oracle that proved this target was removed from the tree — see
# docs/validating-bit-exactness.md.
#
# This is the zstd-1.5.5 line (parallel to main's 1.5.7 / 0.157.x). The decoder
# is format-stable and shared; only the compressor is retargeted to 1.5.5.
version = "0.155.0"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust reimplementation of Zstandard, aiming for bit-exact parity with the C libzstd"
license = "BSD-3-Clause"
repository = "https://github.com/danifunker/libzstd-bitexact-rs"
keywords = ["zstd", "zstandard", "compression", "decompression"]
categories = ["compression"]
readme = "README.md"
documentation = "https://docs.rs/libzstd-bitexact-rs"
# Keep the published package lean: ship src, the decode tests, examples, docs,
# and README/ROADMAP/LICENSE. Drop the AI dev guide and the CI config.
exclude = ["/.github", "/CLAUDE.md"]

[dependencies]
# Intentionally empty: the implementation is dependency-free.

# No [dev-dependencies]. The C-libzstd differential oracle (the `zstd` /
# `zstd-sys` dev-deps) was removed once this 1.5.5-bit-exact line was proven and
# published as 0.155.0: the whole project — library, the decode tests in
# tests/format.rs, the in-crate unit tests, and examples — now builds and tests
# with zero C and no third-party crates, so no C toolchain is required.
#
# The differential suite that proved bit-exactness against C libzstd 1.5.5 is
# preserved in git history at tag v0.155.0. If a future 0.155.x patch ever needs
# re-verification, restore it with:
#     git checkout v0.155.0 -- tests benches Cargo.toml Cargo.lock
# (re-adds the zstd/zstd-sys dev-deps), verify, then revert.

[profile.dev]
# The decoder is exercised on megabytes of data in tests; opt-level 1 keeps
# debug test runs fast without hurting compile times much.
opt-level = 1
