# cargo-fuzz crate, detached from the parent package (note the empty
# [workspace] table) so the parent's `cargo test` / `clippy` never try to build
# libFuzzer on stable. Run with: `cargo +nightly fuzz run <target>`.
[package]
name = "libzstd-bitexact-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libzstd-bitexact = { path = ".." }
# The C libzstd, used as the differential oracle in the equivalence target.
zstd = "0.13"

[[bin]]
name = "decode_never_panic"
path = "fuzz_targets/decode_never_panic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_equivalence"
path = "fuzz_targets/decode_equivalence.rs"
test = false
doc = false
bench = false

[workspace]
